services:
  postgres:
    image: postgres:16-alpine
    container_name: leetcode-postgres
    restart: unless-stopped
    environment:
      # Must match code-publisher/src/main/resources/application.properties
      POSTGRES_DB: leetcode
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d leetcode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
